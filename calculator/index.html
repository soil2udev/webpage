<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: auto;
    }
    label {
      font-weight: bold;
      margin-top: 10px;
    }
    input, select, button {
      margin-top: 5px;
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #ddd;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    .btn {
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #45a049;
    }
    #total-amount {
      font-weight: bold;
      margin-top: 20px;
    }
    @media (max-width: 600px) {
      body {
        margin: 10px;
      }
      table, th, td {
        font-size: 14px;
      }
      .btn {
        font-size: 14px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Bill Generator</h2>

    <!-- Customer Details -->
    <form id="customer-form">
      <label for="village">Village</label>
      <input type="text" id="village" placeholder="Enter village name" list="village-list">
      <datalist id="village-list"></datalist>

      <label for="party-name">Party Name</label>
      <input type="text" id="party-name" placeholder="Enter party name" list="party-list">
      <datalist id="party-list"></datalist>

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" placeholder="Enter mobile number">

      <label for="address">Address</label>
      <input type="text" id="address" placeholder="Enter address">
    </form>

    <!-- Add Products -->
    <form id="product-form">
      <label for="product-category">Product Category</label>
      <select id="product-category">
        <option value="Mirchi Powder">Mirchi Powder</option>
        <option value="Haldi Powder">Haldi Powder</option>
        <option value="Dhaniya Powder">Dhaniya Powder</option>
      </select>

      <label for="product-size">Size</label>
      <select id="product-size">
        <option value="50g">50g</option>
        <option value="100g">100g</option>
        <option value="250g">250g</option>
      </select>

      <label for="quantity">Quantity (in kg)</label>
      <input type="number" id="quantity" step="0.01" placeholder="Enter quantity in kg">

      <button type="button" id="add-product" class="btn">Add Product</button>
    </form>

    <!-- Product Table -->
    <table id="product-table">
      <thead>
        <tr>
          <th>Category</th>
          <th>Size</th>
          <th>Quantity (kg)</th>
          <th>Rates</th>
          <th>Total Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="total-amount">Total Amount: Rs 0</div>

    <!-- Generate Bill -->
    <button type="button" id="generate-bill" class="btn">Generate Bill</button>
  </div>

  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/1RKR8GkuxrcjzN1Vs5ijFV0W7JYmBt8aHIIv8mqrxtGE/export?format=csv";

    const villageList = document.getElementById("village-list");
    const partyList = document.getElementById("party-list");
    const villageInput = document.getElementById("village");
    const partyInput = document.getElementById("party-name");
    const mobileInput = document.getElementById("mobile");
    const addressInput = document.getElementById("address");
    const productTable = document.getElementById("product-table").querySelector("tbody");
    const totalAmountDisplay = document.getElementById("total-amount");

    let partyData = [];
    let products = [];
    let totalAmount = 0;

    const prices = {
      "Mirchi Powder": {
        "50g": [290, 288, 286, 284, 282, 280],
        "100g": [275, 273, 271, 269, 267, 265],
        "250g": [270, 268, 266, 264, 262, 260],
      },
      "Haldi Powder": { "50g": 18, "100g": 27, "250g": 63 },
      "Dhaniya Powder": { "50g": 15, "100g": 20, "250g": 40 },
    };

    // Fetch party data
    async function fetchPartyData() {
      const response = await fetch(sheetURL);
      const csvData = await response.text();
      const rows = csvData.split("\n").map(row => row.split(","));
      partyData = rows.slice(1).map(([village, partyName, address, mobile]) => ({
        village: village.trim(),
        partyName: partyName.trim(),
        address: address.trim(),
        mobile: mobile.trim(),
      }));

      updateVillageList();
    }

    function updateVillageList() {
      const villages = [...new Set(partyData.map(p => p.village))];
      villageList.innerHTML = villages.map(v => `<option value="${v}">`).join("");
    }

    villageInput.addEventListener("input", () => {
      const selectedVillage = villageInput.value.trim();
      const parties = partyData.filter(p => p.village === selectedVillage).map(p => p.partyName);
      partyList.innerHTML = parties.map(p => `<option value="${p}">`).join("");
    });

    partyInput.addEventListener("input", () => {
      const selectedVillage = villageInput.value.trim();
      const selectedPartyName = partyInput.value.trim();
      const selectedParty = partyData.find(
        p => p.village === selectedVillage && p.partyName === selectedPartyName
      );
      if (selectedParty) {
        addressInput.value = selectedParty.address;
        mobileInput.value = selectedParty.mobile;
      } else {
        addressInput.value = "";
        mobileInput.value = "";
      }
    });

    // Add product
    document.getElementById("add-product").addEventListener("click", () => {
      const category = document.getElementById("product-category").value;
      const size = document.getElementById("product-size").value;
      const quantity = parseFloat(document.getElementById("quantity").value || 0);

      if (quantity <= 0) {
        alert("Please enter a valid quantity.");
        return;
      }

      let perKgRate;
      let perPouchRate;
      let totalPrice;

      if (category === "Mirchi Powder") {
        const totalMirchiQuantity = calculateTotalMirchiQuantity(quantity);
        const tier = determineRateTier(totalMirchiQuantity);
        perKgRate = prices[category][size][tier];
      } else {
        perKgRate = prices[category][size];
      }

      const pouchSizeInKg = parseFloat(size.replace("g", "")) / 1000;
      perPouchRate = (perKgRate * pouchSizeInKg).toFixed(2);
      totalPrice = (perKgRate * quantity).toFixed(2);

      products.push({
        category,
        size,
        quantity,
        perKgRate: perKgRate.toFixed(2),
        perPouchRate,
        totalPrice,
      });

      recalculateAllProducts();
      updateProductTable();
    });

    function calculateTotalMirchiQuantity(newQuantity) {
      return products
        .filter(p => p.category === "Mirchi Powder")
        .reduce((sum, p) => sum + p.quantity, 0) + newQuantity;
    }

    function determineRateTier(totalQuantity) {
      if (totalQuantity <= 3) return 0;
      if (totalQuantity <= 5) return 1;
      if (totalQuantity <= 10) return 2;
      if (totalQuantity <= 15) return 3;
      if (totalQuantity <= 20) return 4;
      return 5;
    }

    function recalculateAllProducts() {
      totalAmount = 0; // Reset totalAmount
      const totalMirchiQuantity = calculateTotalMirchiQuantity(0); // Total Mirchi Quantity
      const tier = determineRateTier(totalMirchiQuantity);

      products = products.map(p => {
        if (p.category === "Mirchi Powder") {
          const perKgRate = prices["Mirchi Powder"][p.size][tier];
          const pouchSizeInKg = parseFloat(p.size.replace("g", "")) / 1000;
          const perPouchRate = (perKgRate * pouchSizeInKg).toFixed(2);
          const totalPrice = (perKgRate * p.quantity).toFixed(2);

          totalAmount += parseFloat(totalPrice); // Update total amount
          return { ...p, perKgRate: perKgRate.toFixed(2), perPouchRate, totalPrice };
        }

        totalAmount += parseFloat(p.totalPrice); // Add non-Mirchi products
        return p;
      });
    }

    function updateProductTable() {
      const productTable = document.getElementById("product-table").querySelector("tbody");
      productTable.innerHTML = "";
      products.forEach((product, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${product.category}</td>
          <td>${product.size}</td>
          <td>${product.quantity} kg</td>
          <td>Per Kg: Rs ${product.perKgRate}<br>Per Pouch: Rs ${product.perPouchRate}</td>
          <td>Rs ${product.totalPrice}</td>
          <td><button class="btn" onclick="removeProduct(${index})">Remove</button></td>
        `;
        productTable.appendChild(row);
      });
      totalAmountDisplay.textContent = `Total Amount: Rs ${totalAmount.toFixed(2)}`;
    }

    function removeProduct(index) {
      products.splice(index, 1);
      recalculateAllProducts();
      updateProductTable();
    }

    document.getElementById("generate-bill").addEventListener("click", () => {
      const { jsPDF } = window.jspdf;

      const doc = new jsPDF();
      const currentTime = new Date();
      const formattedDate = `${currentTime.toLocaleDateString()} ${currentTime.toLocaleTimeString()}`;
      const partyName = document.getElementById("party-name").value.trim() || "new_party";

      doc.setFontSize(14);
      doc.text("Invoice", 20, 10);
      doc.text(`Date: ${formattedDate}`, 20, 20);

      const rows = products.map(p => [
        p.category,
        p.size,
        `${p.quantity} kg`,
        `Per Kg: Rs ${p.perKgRate}\nPer Pouch: Rs ${p.perPouchRate}`,
        `Rs ${p.totalPrice}`,
      ]);

      doc.autoTable({
        head: [["Category", "Size", "Quantity (kg)", "Rates", "Total Price"]],
        body: rows,
        startY: 30,
      });

      doc.text(`Total Amount: Rs ${totalAmount.toFixed(2)}`, 20, doc.lastAutoTable.finalY + 10);
      const timestamp = `${currentTime.getHours()}_${currentTime.getMinutes()}_${currentTime.getDate()}_${currentTime.getMonth() + 1}_${currentTime.getFullYear()}`;
      doc.save(`${partyName.replace(/\s+/g, "")}_${timestamp}.pdf`);
    });

    fetchPartyData();
  </script>
</body>
</html>
