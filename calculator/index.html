<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: auto;
    }
    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }
    input, select, textarea, button {
      margin-top: 5px;
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #ddd;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    .btn {
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #45a049;
    }
    #total-amount {
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Bill Generator</h2>

    <!-- Customer Details -->
    <form id="customer-form">
      <label for="village">Village</label>
      <input type="text" id="village" placeholder="Enter village name" list="village-list">
      <datalist id="village-list"></datalist>

      <label for="party-name">Party Name</label>
      <input type="text" id="party-name" placeholder="Enter party name" list="party-list">
      <datalist id="party-list"></datalist>

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" placeholder="Enter mobile number">

      <label for="address">Address</label>
      <input type="text" id="address" placeholder="Enter address">

      <label for="additional-notes">Additional Notes</label>
      <textarea id="additional-notes" placeholder="Enter any additional notes"></textarea>
    </form>

    <!-- Add Products -->
    <form id="product-form">
      <label for="product-category">Product Category</label>
      <select id="product-category">
        <option value="Mirchi Powder">Mirchi Powder</option>
        <option value="Haldi Powder">Haldi Powder</option>
        <option value="Dhaniya Powder">Dhaniya Powder</option>
      </select>

      <label for="product-size">Size</label>
      <select id="product-size">
        <option value="50g">50g</option>
        <option value="100g">100g</option>
        <option value="250g">250g</option>
        <option value="Loose">Loose</option>
      </select>

      <label for="quantity">Quantity (in kg)</label>
      <input type="number" id="quantity" step="0.01" placeholder="Enter quantity in kg">

      <button type="button" id="add-product" class="btn">Add Product</button>
    </form>

    <!-- Product Table -->
    <table id="product-table">
      <thead>
        <tr>
          <th>Category</th>
          <th>Size</th>
          <th>Quantity (kg)</th>
          <th>Rates</th>
          <th>Total Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="total-amount">Total Amount: Rs 0</div>

    <!-- Generate Bill -->
    <button type="button" id="generate-bill" class="btn">Generate Bill</button>
  </div>

  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/1RKR8GkuxrcjzN1Vs5ijFV0W7JYmBt8aHIIv8mqrxtGE/export?format=csv";

    const prices = {
      "Mirchi Powder": {
        "50g": [290, 288, 286, 284, 282, 280],
        "100g": [275, 273, 271, 269, 267, 265],
        "250g": [270, 268, 266, 264, 262, 260],
        "Loose": [235, 232, 229, 226, 223, 220],
      },
      "Haldi Powder": { "50g": 280, "100g": 270, "250g": 252 },
      "Dhaniya Powder": { "50g": 220, "100g": 185, "250g": 160 },
    };

    let partyData = [];
    let products = [];
    let totalAmount = 0;

    const villageInput = document.getElementById("village");
    const partyInput = document.getElementById("party-name");
    const mobileInput = document.getElementById("mobile");
    const addressInput = document.getElementById("address");
    const partyList = document.getElementById("party-list");
    const productTable = document.getElementById("product-table").querySelector("tbody");
    const totalAmountDisplay = document.getElementById("total-amount");

    async function fetchPartyData() {
      try {
        const response = await fetch(sheetURL);
        if (!response.ok) throw new Error("Failed to fetch data.");
        const csvData = await response.text();
        const rows = csvData.split("\n").map(row => row.split(","));
        partyData = rows.slice(1).map(([village, partyName, address, mobile]) => ({
          village: village.trim(),
          partyName: partyName.trim(),
          address: address.trim(),
          mobile: mobile.trim(),
        }));
        updateVillageSuggestions();
      } catch (error) {
        alert("Error fetching party data: " + error.message);
      }
    }

    function updateVillageSuggestions() {
      const villages = [...new Set(partyData.map(p => p.village))];
      document.getElementById("village-list").innerHTML = villages.map(v => `<option value="${v}">`).join("");
    }

    villageInput.addEventListener("input", () => {
      const selectedVillage = villageInput.value.trim();
      const parties = partyData.filter(p => p.village === selectedVillage).map(p => p.partyName);
      partyList.innerHTML = parties.map(p => `<option value="${p}">`).join("");
    });

    partyInput.addEventListener("input", () => {
      const selectedVillage = villageInput.value.trim();
      const selectedParty = partyInput.value.trim();
      const party = partyData.find(p => p.village === selectedVillage && p.partyName === selectedParty);

      if (party) {
        addressInput.value = party.address;
        mobileInput.value = party.mobile;
      } else {
        addressInput.value = "";
        mobileInput.value = "";
      }
    });

    document.getElementById("product-category").addEventListener("change", () => {
      const category = document.getElementById("product-category").value;
      const productSize = document.getElementById("product-size");
      if (category === "Mirchi Powder") {
        productSize.innerHTML = `
          <option value="50g">50g</option>
          <option value="100g">100g</option>
          <option value="250g">250g</option>
          <option value="Loose">Loose</option>
        `;
      } else {
        productSize.innerHTML = `
          <option value="50g">50g</option>
          <option value="100g">100g</option>
          <option value="250g">250g</option>
        `;
      }
    });

    document.getElementById("add-product").addEventListener("click", () => {
      const category = document.getElementById("product-category").value;
      const size = document.getElementById("product-size").value;
      const quantity = parseFloat(document.getElementById("quantity").value);

      if (!quantity || quantity <= 0) {
        alert("Please enter a valid quantity.");
        return;
      }

      let perKgRate = 0;
      if (category === "Mirchi Powder") {
        const totalChilliQuantity = products
          .filter(product => product.category === "Mirchi Powder")
          .reduce((sum, product) => sum + product.quantity, 0) + quantity;
        const tier = determineChilliTier(totalChilliQuantity);
        perKgRate = prices["Mirchi Powder"][size][tier];
      } else {
        perKgRate = prices[category][size];
      }

      const perPouchRate = (perKgRate * (size === "Loose" ? 1 : parseInt(size) / 1000)).toFixed(2);
      const totalPrice = (perKgRate * quantity).toFixed(2);

      products.push({
        category,
        size,
        quantity,
        perKgRate: perKgRate.toFixed(2),
        perPouchRate,
        totalPrice,
      });

      recalculateChilliPrices();
      updateProductTable();
    });

    function determineChilliTier(totalQuantity) {
      if (totalQuantity <= 3) return 0;
      if (totalQuantity <= 5) return 1;
      if (totalQuantity <= 10) return 2;
      if (totalQuantity <= 15) return 3;
      if (totalQuantity <= 20) return 4;
      return 5;
    }

    function recalculateChilliPrices() {
      const totalChilliQuantity = products
        .filter(product => product.category === "Mirchi Powder")
        .reduce((sum, product) => sum + product.quantity, 0);

      const tier = determineChilliTier(totalChilliQuantity);

      products = products.map(product => {
        if (product.category === "Mirchi Powder") {
          const perKgRate = prices["Mirchi Powder"][product.size][tier];
          const perPouchRate = (perKgRate * (product.size === "Loose" ? 1 : parseInt(product.size) / 1000)).toFixed(2);
          const totalPrice = (perKgRate * product.quantity).toFixed(2);
          return { ...product, perKgRate: perKgRate.toFixed(2), perPouchRate, totalPrice };
        }
        return product;
      });
    }

    function updateProductTable() {
      productTable.innerHTML = "";
      totalAmount = 0;

      products.forEach((product, index) => {
        totalAmount += parseFloat(product.totalPrice);
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${product.category}</td>
          <td>${product.size}</td>
          <td>${product.quantity} kg</td>
          <td>Per Kg: Rs ${product.perKgRate}<br>Per Pouch: Rs ${product.perPouchRate}</td>
          <td>Rs ${product.totalPrice}</td>
          <td><button class="btn" onclick="removeProduct(${index})">Remove</button></td>
        `;
        productTable.appendChild(row);
      });

      totalAmountDisplay.textContent = `Total Amount: Rs ${totalAmount.toFixed(2)}`;
    }

    function removeProduct(index) {
      products.splice(index, 1);
      recalculateChilliPrices();
      updateProductTable();
    }

    document.getElementById("generate-bill").addEventListener("click", () => {
      const jsPDF = window.jspdf.jsPDF;
      const doc = new jsPDF();

      const partyName = document.getElementById("party-name").value.trim();
      const village = document.getElementById("village").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const address = document.getElementById("address").value.trim();
      const additionalNotes = document.getElementById("additional-notes").value.trim();

      if (!partyName || !village || !mobile || !address) {
        alert("Please fill in all customer details before generating the bill.");
        return;
      }

      const isNewParty = !partyData.some(p => p.partyName === partyName);
      const timestamp = new Date()
        .toLocaleString("en-GB")
        .replace(/[/, :]/g, "_")
        .replace(",", "");
      const pdfName = `${isNewParty ? "new_" : ""}${partyName.replace(/\s+/g, "_")}_${timestamp}.pdf`;

      doc.setFontSize(14);
      doc.text("Invoice", 10, 10);
      doc.text(`Party Name: ${partyName}`, 10, 20);
      doc.text(`Village: ${village}`, 10, 30);
      doc.text(`Mobile: ${mobile}`, 10, 40);
      doc.text(`Address: ${address}`, 10, 50);
      doc.text(`Additional Notes: ${additionalNotes}`, 10, 60);

      const rows = products.map(p => [
        p.category,
        p.size,
        `${p.quantity} kg`,
        `Per Kg: Rs ${p.perKgRate}\nPer Pouch: Rs ${p.perPouchRate}`,
        `Rs ${p.totalPrice}`,
      ]);

      doc.autoTable({
        head: [["Category", "Size", "Quantity", "Rate", "Total"]],
        body: rows,
        startY: 70,
      });

      doc.text(`Total Amount: Rs ${totalAmount.toFixed(2)}`, 10, doc.lastAutoTable.finalY + 10);
      doc.save(pdfName);
    });

    fetchPartyData();
  </script>
</body>
</html>
